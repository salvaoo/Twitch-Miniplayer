<!DOCTYPE html>
<html>

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <meta http-equiv="X-UA-Compatible" content="ie=edge" />
   <title>Twitch Miniplayer</title>
   <script src="popup.js"></script>
   <style>
      body {
         width: 250px;
         margin: 0;
         padding: 0;
      }

      h1 {
         text-align: center;
         font-size: 20px;
         margin: 0 0 10px;
         padding: 8px 0;
         background: rgb(206, 32, 32);
         color: white;
      }

      .row {
         font-size: 14px;
         display: flex;
         flex-direction: row;
         flex-wrap: nowrap;
         margin: 0 10px;
      }

      .centered {
         justify-content: center;
      }

      .pad-left {
         padding: 5px 0 5px 5px;
      }

      .pad-left input {
         filter: hue-rotate(160deg);
      }

      .version {
         margin-bottom: 10px;
      }

      .version a {
         color: rgb(206, 32, 32);
      }
   </style>
</head>

<body>
   <h1>Twitch Miniplayer</h1>
   <div class="row">
      <div>Options:</div>
   </div>
   <div class="row pad-left">
      <div><input type="checkbox" id="mute_all_ads"></div>
      <div>Mute Ads</div>
   </div>
   <div class="row centered">
      <div>--------------------------------</div>
   </div>
   <div class="row centered version">
      <div><span id="version"></span> - Made by <a href="https://salvagr.com">@salvagr</a></div>
   </div>
</body>

</html>
